name: Backend CI/CD

on:
  push:
    branches:
      [main]
  pull_request:
    branches:
      [main]

jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name:  Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        
      - name: Unit test
        run: pnpm run test



